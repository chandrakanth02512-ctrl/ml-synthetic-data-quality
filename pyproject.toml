[build-system]
requires = ["setuptools>=69"]
build-backend = "setuptools.build_meta"

[project]
name = "ml-synthetic-data-quality"
version = "0.1.0"
description = "Reproducible synthetic transaction quality checks and anomaly detection"
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
    "numpy>=1.26,<3",
    "pandas>=2.2,<4",
    "scikit-learn>=1.5,<2",
    "joblib>=1.4,<2",
]

[project.optional-dependencies]
dev = ["pytest>=8,<10", "pytest-cov>=5,<8", "ruff>=0.9,<1"]
cloud = ["google-cloud-storage>=3.0,<4"]

[project.scripts]
synthetic-quality = "synthetic_quality.pipeline:main"
synthetic-quality-cloud = "synthetic_quality.cloud_job:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "--strict-markers"
filterwarnings = ["error"]

[tool.coverage.run]
source = ["synthetic_quality"]
branch = true

[tool.coverage.report]
show_missing = true

[tool.ruff]
target-version = "py311"
line-length = 100

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP"]
