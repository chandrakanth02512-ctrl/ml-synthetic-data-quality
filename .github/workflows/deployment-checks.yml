name: Offline deployment recovery checks

on:
  push:
    branches: ['deploy/**']
  pull_request:
    paths:
      - 'deploy/gcp/**'
      - '.github/workflows/deployment-checks.yml'

permissions:
  contents: read

jobs:
  recovery:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Credential-free regression and source-preservation checks
        run: python -m unittest discover -s deploy/gcp -p 'test_*.py' -v
