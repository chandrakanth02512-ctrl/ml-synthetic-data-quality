name: Offline OIDC security checks

on:
  push:
    branches: ['deploy/github-oidc']
  pull_request:
    paths:
      - 'deploy/oidc/**'
      - '.github/workflows/gcp-deploy.yml'
      - '.github/workflows/gcp-execute.yml'
      - '.github/workflows/oidc-checks.yml'

permissions:
  contents: read

jobs:
  security:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          persist-credentials: false
      - uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1 # v6
        with:
          python-version: '3.12'
      - name: Offline trust, approval, IAM and runtime tests
        run: python -m unittest discover -s deploy/oidc -p 'test_*.py' -v
      - name: Lint and format the new standard-library tools
        run: |
          python -m pip install 'ruff==0.17.3'
          python -m ruff check deploy/oidc
          python -m ruff format --check deploy/oidc
      - name: Validate manual workflow syntax with checksum-pinned actionlint
        shell: bash
        run: |
          set -euo pipefail
          archive="$RUNNER_TEMP/actionlint_1.7.12_linux_amd64.tar.gz"
          curl --fail --silent --show-error --location \
            https://github.com/rhysd/actionlint/releases/download/v1.7.12/actionlint_1.7.12_linux_amd64.tar.gz \
            --output "$archive"
          printf '%s  %s\n' \
            '8aca8db96f1b94770f1b0d72b6dddcb1ebb8123cb3712530b08cc387b349a3d8' \
            "$archive" | sha256sum --check
          tar -xzf "$archive" -C "$RUNNER_TEMP" actionlint
          "$RUNNER_TEMP/actionlint" \
            .github/workflows/gcp-deploy.yml \
            .github/workflows/gcp-execute.yml \
            .github/workflows/oidc-checks.yml
