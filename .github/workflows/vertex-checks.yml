name: Offline Vertex training checks
on:
  push:
    branches: ['feat/vertex-training']
  pull_request:
    paths:
      - 'src/synthetic_quality_vertex/**'
      - 'tests_vertex/**'
      - 'tools/vertex_assets.py'
      - 'vertex/**'
      - '.github/workflows/vertex-checks.yml'
permissions:
  contents: read
jobs:
  vertex-and-regressions:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      SPARK_LOCAL_IP: 127.0.0.1
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          persist-credentials: false
      - uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1 # v6
        with:
          python-version: '3.12'
      - name: Select Java for Dataproc contract regression tests
        run: |
          test -x "$JAVA_HOME_21_X64/bin/java"
          printf 'JAVA_HOME=%s\n' "$JAVA_HOME_21_X64" >> "$GITHUB_ENV"
          printf '%s/bin\n' "$JAVA_HOME_21_X64" >> "$GITHUB_PATH"
      - name: Install existing isolated feature environment
        run: |
          python -m pip install -e '.[dev]' -r requirements-lakehouse.txt
          python -m pip check
      - name: Dataproc and BigQuery regressions
        run: python -m pytest -c tests_lakehouse/pytest.ini tests_lakehouse -q
      - name: Vertex training, contracts, submission and prediction tests
        run: python -m pytest -c tests_vertex/pytest.ini tests_vertex --cov=synthetic_quality_vertex --cov-report=term-missing
      - name: Lint and format
        run: |
          python -m ruff check src tests tests_lakehouse tests_vertex tools jobs
          python -m ruff format --check src tests tests_lakehouse tests_vertex tools jobs
